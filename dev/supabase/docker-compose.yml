# Lean Supabase-compatible stack for tests and local development.
# Postgres + GoTrue + PostgREST + Realtime + pg-meta behind one gateway on :54321.
name: stellar-dev
services:
  db:
    build:
      context: .
      dockerfile: db.Dockerfile
    image: stellar-dev-db:15
    # wal2json must be allow-listed as an output plugin on current Postgres releases.
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=10
      -c max_wal_senders=10
      -c fsync=off
      -c output_plugin_libraries=pgoutput,test_decoding,wal2json
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["54322:5432"]
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U postgres -h 127.0.0.1 && psql -U postgres -tc "select 1 from pg_publication where pubname=''supabase_realtime''" | grep -q 1',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
  auth:
    image: supabase/gotrue:v2.198.0
    depends_on: { db: { condition: service_healthy } }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:3100
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: stellar-dev-jwt-secret-with-at-least-32-characters
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 10000
      GOTRUE_RATE_LIMIT_VERIFY: 10000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9999/health"]
      interval: 2s
      timeout: 5s
      retries: 30
  rest:
    image: postgrest/postgrest:v16.6
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: stellar-dev-jwt-secret-with-at-least-32-characters
      PGRST_DB_CHANNEL_ENABLED: "true"
  realtime:
    image: supabase/realtime:v2.174.0
    depends_on: { db: { condition: service_healthy } }
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: postgres
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: stellar-dev-jwt-secret-with-at-least-32-characters
      METRICS_JWT_SECRET: stellar-dev-jwt-secret-with-at-least-32-characters
      SECRET_KEY_BASE: UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
  meta:
    image: supabase/postgres-meta:v0.100.1
    depends_on: { db: { condition: service_healthy } }
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: postgres
  gateway:
    image: nginx:alpine
    depends_on:
      auth: { condition: service_healthy }
      rest: { condition: service_started }
      realtime: { condition: service_started }
      meta: { condition: service_started }
    ports: ["54321:8000"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/auth/v1/health"]
      interval: 2s
      timeout: 5s
      retries: 30
