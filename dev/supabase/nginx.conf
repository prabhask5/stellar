# Stands in for Kong: one origin that routes to auth, rest, realtime and pg-meta.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 8000;
  client_max_body_size 20m;
  resolver 127.0.0.11 valid=5s;

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $http_host;
  }
  location /realtime/v1/ {
    set $rt realtime:4000;
    rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
    proxy_pass http://$rt;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host realtime-dev.supabase-realtime;
    proxy_read_timeout 3600s;
  }
  location /pg/ {
    if ($http_apikey != "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UtZGV2IiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjIyMDAwMDAwMDB9.lcA2RCawYQMX4POgET9AdE1nKOJgUzWEMMbKf7QZkV4") { return 401; }
    proxy_pass http://meta:8080/;
  }
}
